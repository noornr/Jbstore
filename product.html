<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | JB STORE</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       RESET & BASE
    ========================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #0A0A0A;
      font-family: 'Poppins', sans-serif;
      color: #E8E8E8;
      padding-bottom: 80px;
    }

    /* ==========================================
       SCROLLBAR
    ========================================== */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0A0A0A;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #D4AF37, #F3CF55);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #F3CF55, #D4AF37);
    }

    /* ==========================================
       HEADER - PREMIUM
    ========================================== */
    .product-header {
      height: 82px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: linear-gradient(180deg, #141414 0%, #0A0A0A 100%);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .product-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
    }

    .back-btn {
      color: #D4AF37;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      padding: 8px 16px;
      border-radius: 30px;
      background: rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.08);
    }

    .back-btn:hover {
      color: #F3CF55;
      transform: translateX(-4px);
      background: rgba(212, 175, 55, 0.12);
      border-color: rgba(212, 175, 55, 0.2);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.08);
    }

    .product-logo {
      font-size: 32px;
      font-weight: 800;
      color: #D4AF37;
      letter-spacing: 0.5px;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
    }

    .product-logo span {
      color: #fff;
      font-weight: 300;
    }

    /* ==========================================
       PRODUCT PAGE CONTAINER
    ========================================== */
    .product-page {
      width: 90%;
      max-width: 1300px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================
       IMAGE SECTION - PREMIUM
    ========================================== */
    .product-image-section {
      position: relative;
    }

    .product-image-box {
      background: linear-gradient(145deg, #1A1A1A, #111111);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      position: relative;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.02);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .product-image-box::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), transparent, rgba(212, 175, 55, 0.1));
      border-radius: 22px;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .product-image-box:hover::before {
      opacity: 1;
    }

    .product-image-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(255, 215, 0, 0.05);
      border-color: rgba(255, 215, 0, 0.25);
    }

    .product-image-box img {
      max-width: 100%;
      max-height: 350px;
      object-fit: contain;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.3));
    }

    .product-image-box:hover img {
      transform: scale(1.05) rotate(-2deg);
      filter: drop-shadow(0 12px 50px rgba(212, 175, 55, 0.1));
    }

    .product-offer {
      position: absolute;
      top: 16px;
      left: 16px;
      background: linear-gradient(135deg, #D4AF37, #F3CF55);
      color: #0A0A0A;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      z-index: 2;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 25px rgba(212, 175, 55, 0.3);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%,
      100% {
        box-shadow: 0 4px 25px rgba(212, 175, 55, 0.3);
      }
      50% {
        box-shadow: 0 4px 40px rgba(212, 175, 55, 0.5);
      }
    }

    /* ===== THUMBNAILS ===== */
    .thumbnail-strip {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      overflow-x: auto;
      padding: 8px 4px 12px;
      scroll-snap-type: x mandatory;
    }

    .thumbnail-strip::-webkit-scrollbar {
      height: 3px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 10px;
    }

    .thumbnail-strip img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border: 2px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: #0A0A0A;
      padding: 8px;
      flex-shrink: 0;
      scroll-snap-align: start;
    }

    .thumbnail-strip img:hover {
      border-color: rgba(212, 175, 55, 0.3);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .thumbnail-strip img.active {
      border-color: #FFD700 !important;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.15), inset 0 0 30px rgba(255, 215, 0, 0.05);
      transform: translateY(-4px);
    }

    /* ==========================================
       VARIANTS - PREMIUM
    ========================================== */
    .variant-section {
      margin-top: 16px;
      background: linear-gradient(145deg, #1A1A1A, #111111);
      border: 1px solid rgba(255, 215, 0, 0.08);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.02);
      transition: all 0.4s ease;
    }

    .variant-section:hover {
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.04);
      border-color: rgba(255, 215, 0, 0.15);
    }

    .variant-section label {
      font-size: 13px;
      color: #888;
      font-weight: 500;
      display: block;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .variant-section label span {
      color: #D4AF37;
      font-weight: 600;
    }

    .variant-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .variant-options .opt {
      padding: 10px 18px;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      color: #B8B8B8;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .variant-options .opt::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.05), transparent);
      transition: left 0.5s ease;
    }

    .variant-options .opt:hover::before {
      left: 100%;
    }

    .variant-options .opt .variant-price {
      font-size: 16px;
      font-weight: 700;
      color: #D4AF37;
      margin-top: 4px;
    }

    .variant-options .opt:hover {
      border-color: rgba(212, 175, 55, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      color: #D4AF37;
    }

    .variant-options .opt.active {
      border-color: #FFD700 !important;
      background: rgba(212, 175, 55, 0.08);
      color: #D4AF37;
      box-shadow: 0 8px 30px rgba(255, 215, 0, 0.08);
      transform: translateY(-3px);
    }

    .variant-options .opt.active .variant-price {
      color: #F3CF55;
    }

    /* ==========================================
       PRODUCT INFO - PREMIUM CARDS
    ========================================== */
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-card {
      background: linear-gradient(145deg, #1A1A1A, #111111);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 20px 24px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .info-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .info-card:hover::before {
      opacity: 1;
    }

    .info-card:hover {
      border-color: rgba(212, 175, 55, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
    }

    .product-brand {
      color: #D4AF37;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .product-name {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .product-rating .stars {
      background: linear-gradient(135deg, #388e3c, #43a047);
      color: #fff;
      padding: 2px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(56, 142, 60, 0.2);
    }

    .product-rating .review-count {
      color: #666;
      font-size: 14px;
    }

    .product-price {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 6px 0 2px;
    }

    .product-price .current {
      font-size: 32px;
      font-weight: 700;
      color: #D4AF37;
      letter-spacing: -0.5px;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
    }

    .product-price .old {
      font-size: 18px;
      color: #666;
      text-decoration: line-through;
    }

    .product-price .discount-badge {
      color: #4ECDC4;
      font-weight: 600;
      font-size: 15px;
      background: rgba(78, 205, 196, 0.1);
      padding: 2px 12px;
      border-radius: 20px;
      border: 1px solid rgba(78, 205, 196, 0.15);
    }

    .condition-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      margin-top: 8px;
    }

    .condition-row span {
      color: #666;
      font-size: 14px;
    }

    .condition-row strong {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 14px;
      border-radius: 20px;
    }

    /* ==========================================
       SPECIFICATIONS
    ========================================== */
    .specs-section h2 {
      font-size: 17px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .specs-section h2::after {
      content: '';
      display: block;
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, #D4AF37, transparent);
      margin-top: 6px;
      border-radius: 2px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .spec-row:hover {
      background: rgba(255, 255, 255, 0.02);
      padding: 10px 8px;
      border-radius: 8px;
    }

    .spec-row:last-child {
      border-bottom: none;
    }

    .spec-row span {
      color: #666;
    }

    .spec-row strong {
      color: #E8E8E8;
      font-weight: 500;
      text-align: right;
      max-width: 60%;
    }

    /* ==========================================
       WARRANTY & DESCRIPTION
    ========================================== */
    .warranty {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #D0D0D0;
    }

    .warranty strong {
      color: #D4AF37;
      font-weight: 600;
      background: rgba(212, 175, 55, 0.06);
      padding: 2px 14px;
      border-radius: 20px;
    }

    .product-description {
      font-size: 14px;
      line-height: 1.8;
      color: #B8B8B8;
    }

    /* ==========================================
       ACTION BUTTONS - PREMIUM
    ========================================== */
    .product-actions {
      display: flex;
      gap: 12px;
    }

    .product-actions button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }

    .product-actions button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
      transform: scale(0.5);
    }

    .product-actions button:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    .product-actions button:active {
      transform: scale(0.95);
    }

    .whatsapp-btn {
      background: linear-gradient(135deg, #25D366, #1DA851);
      color: #fff;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.15);
    }

    .whatsapp-btn:hover {
      box-shadow: 0 8px 35px rgba(37, 211, 102, 0.3);
      transform: translateY(-3px);
    }

    .call-btn {
      background: linear-gradient(135deg, #D4AF37, #C9A030);
      color: #0A0A0A;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
    }

    .call-btn:hover {
      box-shadow: 0 8px 35px rgba(212, 175, 55, 0.3);
      transform: translateY(-3px);
      background: linear-gradient(135deg, #F3CF55, #D4AF37);
    }

    /* ==========================================
       STICKY BOTTOM CART BAR - PREMIUM
    ========================================== */
    .sticky-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(17, 17, 17, 0.98), rgba(10, 10, 10, 0.99));
      border-top: 1px solid rgba(212, 175, 55, 0.08);
      padding: 12px 5%;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 999;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
    }

    .sticky-cart-bar .price-tag {
      font-size: 24px;
      font-weight: 700;
      color: #D4AF37;
      white-space: nowrap;
      letter-spacing: -0.5px;
    }

    .sticky-cart-bar .price-tag small {
      font-size: 14px;
      font-weight: 400;
      color: #666;
      text-decoration: line-through;
      margin-left: 8px;
    }

    .sticky-cart-bar .cart-btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #25D366, #1DA851);
      color: #fff;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.15);
      position: relative;
      overflow: hidden;
    }

    .sticky-cart-bar .cart-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .sticky-cart-bar .cart-btn:hover::after {
      opacity: 1;
    }

    .sticky-cart-bar .cart-btn:hover {
      box-shadow: 0 8px 35px rgba(37, 211, 102, 0.3);
      transform: translateY(-2px);
    }

    .sticky-cart-bar .buy-btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #D4AF37, #F3CF55);
      color: #0A0A0A;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
      position: relative;
      overflow: hidden;
    }

    .sticky-cart-bar .buy-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .sticky-cart-bar .buy-btn:hover::after {
      opacity: 1;
    }

    .sticky-cart-bar .buy-btn:hover {
      box-shadow: 0 8px 35px rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
    }

    .sticky-cart-bar .cart-btn:active,
    .sticky-cart-bar .buy-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================
       SIMILAR PRODUCTS - PREMIUM
    ========================================== */
    .similar-products {
      margin-top: 8px;
    }

    .similar-products h3 {
      font-size: 19px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .similar-products h3 span {
      color: #D4AF37;
    }

    .similar-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 8px 0 16px;
      scroll-snap-type: x mandatory;
    }

    .similar-scroll::-webkit-scrollbar {
      height: 3px;
    }

    .similar-scroll::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 10px;
    }

    .similar-item {
      min-width: 160px;
      background: linear-gradient(145deg, #1A1A1A, #111111);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      scroll-snap-align: start;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .similar-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .similar-item:hover::before {
      opacity: 1;
    }

    .similar-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.3);
      border-color: rgba(212, 175, 55, 0.1);
    }

    .similar-item img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #0A0A0A;
      border-radius: 8px;
      padding: 10px;
      transition: all 0.4s ease;
    }

    .similar-item:hover img {
      transform: scale(1.08);
    }

    .similar-item .s-name {
      font-size: 13px;
      font-weight: 500;
      color: #E8E8E8;
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }

    .similar-item .s-price {
      font-size: 15px;
      font-weight: 600;
      color: #D4AF37;
      margin-top: 4px;
    }

    /* ==========================================
       TOAST NOTIFICATION - PREMIUM
    ========================================== */
    .toast-notification {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(145deg, #1A1A1A, #0A0A0A);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 16px;
      padding: 14px 24px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      z-index: 99999;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 14px;
      animation: toastSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      max-width: 90%;
    }

    .toast-notification button {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .toast-notification button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
    }

    .toast-notification.fade-out {
      animation: toastFadeOut 0.4s ease forwards;
    }

    @keyframes toastSlideUp {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(40px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    @keyframes toastFadeOut {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px) scale(0.95);
      }
    }

    /* ==========================================
       RESPONSIVE - PREMIUM
    ========================================== */
    @media (max-width: 1024px) {
      .product-page {
        grid-template-columns: 1fr;
        gap: 30px;
        width: 95%;
      }
      .product-image-box {
        min-height: 300px;
      }
      .product-image-box img {
        max-height: 280px;
      }
    }

    @media (max-width: 768px) {
      .product-header {
        height: 56px;
        padding: 0 12px;
        gap: 8px;
      }
      .product-logo {
        font-size: 18px;
      }
      .back-btn {
        font-size: 12px;
        padding: 6px 12px;
      }
      .product-page {
        width: 100%;
        padding: 0 10px;
        margin: 16px auto;
        gap: 16px;
      }
      .product-image-box {
        padding: 16px;
        min-height: 220px;
        border-radius: 14px;
      }
      .product-image-box img {
        max-height: 180px;
      }
      .product-offer {
        font-size: 10px;
        padding: 4px 12px;
        top: 10px;
        left: 10px;
      }
      .thumbnail-strip img {
        width: 56px;
        height: 56px;
        padding: 4px;
      }
      .variant-section {
        padding: 14px 16px;
      }
      .variant-options .opt {
        padding: 8px 14px;
        font-size: 12px;
        min-width: 80px;
      }
      .variant-options .opt .variant-price {
        font-size: 14px;
      }
      .info-card {
        padding: 14px 16px;
        border-radius: 12px;
      }
      .product-name {
        font-size: 20px;
      }
      .product-price .current {
        font-size: 24px;
      }
      .product-price .old {
        font-size: 14px;
      }
      .product-actions {
        flex-direction: column;
      }
      .product-actions button {
        padding: 12px 0;
        font-size: 13px;
      }
      .sticky-cart-bar {
        padding: 10px 12px;
        gap: 10px;
      }
      .sticky-cart-bar .price-tag {
        font-size: 18px;
      }
      .sticky-cart-bar .price-tag small {
        font-size: 12px;
      }
      .sticky-cart-bar .cart-btn,
      .sticky-cart-bar .buy-btn {
        font-size: 13px;
        padding: 12px 0;
      }
      .similar-item {
        min-width: 120px;
        padding: 10px;
      }
      .similar-item img {
        height: 80px;
        padding: 6px;
      }
      .similar-item .s-name {
        font-size: 11px;
        min-height: 30px;
      }
      .similar-item .s-price {
        font-size: 13px;
      }
      .toast-notification {
        bottom: 80px;
        font-size: 12px;
        padding: 10px 16px;
        width: 90%;
      }
      body {
        padding-bottom: 70px;
      }
    }

    @media (max-width: 480px) {
      .product-image-box {
        min-height: 180px;
        padding: 12px;
      }
      .product-image-box img {
        max-height: 140px;
      }
      .product-name {
        font-size: 17px;
      }
      .product-price .current {
        font-size: 20px;
      }
      .variant-options .opt {
        padding: 6px 10px;
        font-size: 11px;
        min-width: 60px;
        flex: 1;
      }
      .variant-options .opt .variant-price {
        font-size: 12px;
      }
      .spec-row {
        font-size: 12px;
        padding: 8px 0;
      }
      .sticky-cart-bar .cart-btn,
      .sticky-cart-bar .buy-btn {
        font-size: 12px;
        padding: 10px 0;
      }
    }
  </style>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="product-header">
    <a href="index.html" class="back-btn">← Back</a>
    <div class="product-logo">JB <span>STORE</span></div>
  </header>

  <!-- ===== PRODUCT PAGE ===== -->
  <main class="product-page" id="productPage">

    <!-- ===== LEFT: IMAGES + VARIANTS ===== -->
    <div class="product-image-section">
      <div class="product-image-box">
        <span id="productOffer" class="product-offer"></span>
        <img id="productImage" src="" alt="Product">
      </div>

      <div class="thumbnail-strip" id="thumbnailStrip"></div>

      <div class="variant-section">
        <label>📱 Select <span>Variant</span></label>
        <div class="variant-options" id="variantOptions"></div>
      </div>
    </div>

    <!-- ===== RIGHT: INFO ===== -->
    <div class="product-info">

      <div class="info-card">
        <p id="productBrand" class="product-brand"></p>
        <h1 id="productName" class="product-name"></h1>
        <div class="product-rating">
          <span class="stars" id="productRating">⭐ 4.5</span>
          <span class="review-count" id="productReviews">(0 reviews)</span>
        </div>
        <div class="product-price">
          <span class="current" id="productPrice">₹0</span>
          <span class="old" id="productOldPrice">₹0</span>
          <span class="discount-badge" id="productDiscount"></span>
        </div>
        <div class="condition-row">
          <span>Condition</span>
          <strong id="productCondition">New</strong>
        </div>
      </div>

      <div class="info-card specs-section">
        <h2>📋 Specifications</h2>
        <div id="specList"></div>
      </div>

      <div class="info-card warranty">
        🛡️ Warranty: <strong id="productWarranty">1 Year</strong>
      </div>

      <div class="info-card">
        <p id="productDescription" class="product-description"></p>
      </div>

      <div class="info-card" style="border-color:rgba(212,175,55,0.05);">
        <div class="product-actions">
          <button class="whatsapp-btn" onclick="contactWhatsApp()">💬 WhatsApp Enquiry</button>
          <button class="call-btn" onclick="callStore()">📞 Call Store</button>
        </div>
      </div>

      <div class="similar-products">
        <h3>🔄 Similar <span>Products</span></h3>
        <div class="similar-scroll" id="similarScroll"></div>
      </div>

    </div>

  </main>

  <!-- ===== STICKY BOTTOM BAR ===== -->
  <div class="sticky-cart-bar">
    <span class="price-tag" id="stickyPrice">₹0 <small>₹0</small></span>
    <button class="cart-btn" onclick="addToCartFromProduct()">🛒 Add to Cart</button>
    <button class="buy-btn" onclick="buyNow()">⚡ Buy Now</button>
  </div>

  <script>
    // ==========================================
    // STORE CONFIG
    // ==========================================
    const STORE_PHONE = "919999999999";

    // ==========================================
    // ALL PRODUCTS - GLOBAL REFERENCE
    // ==========================================
    let allProducts = [];

    // ==========================================
    // TOAST
    // ==========================================
    function showToast(msg) {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      toast.innerHTML = `
        <span>${msg}</span>
        <button onclick="this.parentElement.remove()">✕</button>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ==========================================
    // GET PRODUCT ID FROM URL
    // ==========================================
    function getProductIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || params.get('product') || params.get('p');
    }

    // ==========================================
    // LOAD PRODUCT
    // ==========================================
    function loadProduct() {
      console.log('=== LOADING PRODUCT ===');
      console.log('All products count:', allProducts.length);

      let productId = getProductIdFromURL();
      console.log('Product ID from URL:', productId);

      let productData = null;

      if (productId) {
        productData = allProducts.find(p => p.id === productId);
        console.log('Found by URL:', productData ? productData.name : 'NOT FOUND');
      }

      if (!productData) {
        const saved = JSON.parse(localStorage.getItem('selectedProduct'));
        console.log('LocalStorage saved:', saved);
        if (saved) {
          productData = allProducts.find(p => p.id === saved.id);
          console.log('Found by localStorage:', productData ? productData.name : 'NOT FOUND');
        }
      }

      if (!productData && allProducts.length > 0) {
        productData = allProducts[0];
        console.log('Using first product as fallback:', productData.name);
      }

      if (!productData) {
        console.log('NO PRODUCT FOUND!');
        document.getElementById('productPage').innerHTML = `
          <div style="text-align:center;padding:80px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:20px;">
            <div style="font-size:60px;margin-bottom:20px;">🔍</div>
            <h2 style="color:#D4AF37;font-size:28px;">Product Not Found</h2>
            <p style="color:#888;margin:12px 0 24px;">The product you're looking for doesn't exist.</p>
            <a href="index.html" style="display:inline-block;padding:14px 40px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:12px;text-decoration:none;font-weight:700;transition:all 0.3s ease;">Return to Store</a>
          </div>
        `;
        return;
      }

      console.log('✅ FINAL PRODUCT:', productData.name);
      window.currentProduct = productData;
      renderProduct(productData);
    }

    // ==========================================
    // RENDER PRODUCT
    // ==========================================
    function renderProduct(product) {
      console.log('Rendering:', product.name);

      document.title = product.name + ' | JB STORE';

      const img = document.getElementById('productImage');
      if (img) {
        img.src = product.image || product.images?.[0] || '';
        img.alt = product.name || '';
      }

      document.getElementById('productName').innerText = product.name || '';
      document.getElementById('productBrand').innerText = product.brand || '';

      document.getElementById('productRating').innerHTML = `⭐ ${product.rating || '4.5'}`;
      document.getElementById('productReviews').innerText = `(${product.reviews || '0'} reviews)`;

      const price = product.price || 0;
      const oldPrice = product.oldPrice || price * 1.3;
      document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
      document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;

      const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
      document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';

      document.getElementById('productCondition').innerText = product.condition || 'New';
      document.getElementById('productWarranty').innerText = product.warranty || '1 Year';
      document.getElementById('productDescription').innerText = product.description || '';
      document.getElementById('productOffer').innerText = product.discount || '';

      document.getElementById('stickyPrice').innerHTML =
        `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;

      const specList = document.getElementById('specList');
      specList.innerHTML = '';
      const specMap = {
        'Storage': product.storage,
        'RAM': product.ram,
        'Capacity': product.capacity,
        'Type': product.type,
        'Energy Rating': product.energyRating,
        'Size': product.size,
        'Resolution': product.resolution,
        'Color': product.color,
        'Model': product.model,
        'Weight': product.weight,
        'Dimensions': product.dimensions
      };

      let hasSpecs = false;
      for (const [key, val] of Object.entries(specMap)) {
        if (val) {
          hasSpecs = true;
          specList.innerHTML += `
            <div class="spec-row">
              <span>${key}</span>
              <strong>${val}</strong>
            </div>
          `;
        }
      }
      if (!hasSpecs) {
        specList.innerHTML = `<div style="color:#666;text-align:center;padding:10px 0;">No specifications available</div>`;
      }

      const thumbStrip = document.getElementById('thumbnailStrip');
      thumbStrip.innerHTML = '';
      const images = product.images || [product.image];
      images.forEach((img, idx) => {
        if (!img) return;
        const el = document.createElement('img');
        el.src = img;
        el.className = idx === 0 ? 'active' : '';
        el.onclick = () => {
          document.getElementById('productImage').src = img;
          document.querySelectorAll('.thumbnail-strip img').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
        };
        thumbStrip.appendChild(el);
      });

      loadVariants(product);
      loadSimilarProducts(product);
    }

    // ==========================================
    // UPDATE PRICE
    // ==========================================
    function updateProductPrice(price, oldPrice) {
      document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
      document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
      const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
      document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
      document.getElementById('stickyPrice').innerHTML =
        `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;
    }

    // ==========================================
    // LOAD VARIANTS
    // ==========================================
    function loadVariants(product) {
      const container = document.getElementById('variantOptions');
      container.innerHTML = '';

      const variants = product.variants || [
        { label: '6GB + 128GB', price: product.price, oldPrice: product.oldPrice || product.price * 1.3 },
        { label: '8GB + 256GB', price: product.price + 5000, oldPrice: (product.oldPrice || product.price * 1.3) + 8000 }
      ];

      variants.forEach((variant, index) => {
        const el = document.createElement('button');
        el.className = 'opt' + (index === 0 ? ' active' : '');
        el.innerHTML = `
          <span>${variant.label}</span>
          <span class="variant-price">₹${variant.price.toLocaleString('en-IN')}</span>
        `;
        el.dataset.price = variant.price;
        el.dataset.oldPrice = variant.oldPrice || variant.price * 1.3;

        el.addEventListener('click', function() {
          document.querySelectorAll('.variant-options .opt').forEach(o => o.classList.remove('active'));
          this.classList.add('active');
          const price = parseInt(this.dataset.price);
          const oldPrice = parseInt(this.dataset.oldPrice);
          updateProductPrice(price, oldPrice);
          showToast(`Selected: ${variant.label}`);
        });

        container.appendChild(el);
      });
    }

    // ==========================================
    // SIMILAR PRODUCTS
    // ==========================================
    function loadSimilarProducts(product) {
      const similar = allProducts
        .filter(p => p.id !== product.id && p.category === product.category)
        .slice(0, 8);

      const container = document.getElementById('similarScroll');
      container.innerHTML = '';

      if (similar.length === 0) {
        container.innerHTML = '<p style="color:#666;font-size:14px;padding:10px 0;">No similar products found.</p>';
        return;
      }

      similar.forEach(p => {
        const div = document.createElement('div');
        div.className = 'similar-item';
        div.onclick = () => {
          window.location.href = `product.html?id=${p.id}`;
        };
        div.innerHTML = `
          <img src="${p.image || p.images?.[0] || ''}" alt="${p.name}">
          <div class="s-name">${p.name}</div>
          <div class="s-price">₹${(p.price || 0).toLocaleString('en-IN')}</div>
        `;
        container.appendChild(div);
      });
    }

    // ==========================================
    // ACTIONS
    // ==========================================
    function contactWhatsApp() {
      const product = window.currentProduct;
      if (!product) return;
      const price = document.getElementById('productPrice').innerText;
      const msg = `Hello JB STORE, I am interested in ${product.name}. Price: ${price}.`;
      window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function callStore() {
      window.location.href = `tel:${STORE_PHONE}`;
    }

    function addToCartFromProduct() {
      const product = window.currentProduct;
      if (!product) {
        showToast('Product not found!');
        return;
      }

      const priceText = document.getElementById('productPrice').innerText;
      const price = parseInt(priceText.replace(/[₹,]/g, ''));
      const activeVariant = document.querySelector('.variant-options .opt.active');
      const variantLabel = activeVariant?.querySelector('span')?.innerText || 'Default';

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const cartId = product.id + '_' + variantLabel;
      const existing = cart.find(item => item.id === cartId);

      if (existing) {
        existing.quantity += 1;
        showToast(`📦 ${product.name} (${variantLabel}) quantity updated!`);
      } else {
        cart.push({
          id: cartId,
          name: product.name,
          brand: product.brand,
          price: price,
          image: product.image || product.images?.[0] || '',
          quantity: 1,
          variant: variantLabel
        });
        showToast(`✅ ${product.name} (${variantLabel}) added to cart!`);
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function buyNow() {
      addToCartFromProduct();
      setTimeout(() => {
        window.location.href = 'cart.html';
      }, 600);
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const total = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.querySelectorAll('.cart-badge').forEach(b => {
        b.textContent = total;
        b.style.display = total > 0 ? 'flex' : 'none';
      });
    }

    // ==========================================
    // INIT
    // ==========================================
    function init() {
      console.log('=== INIT START ===');

      allProducts = [
        ...(typeof mobileProducts !== "undefined" ? mobileProducts : []),
        ...(typeof refrigeratorProducts !== "undefined" ? refrigeratorProducts : []),
        ...(typeof washingProducts !== "undefined" ? washingProducts : []),
        ...(typeof acProducts !== "undefined" ? acProducts : []),
        ...(typeof tvProducts !== "undefined" ? tvProducts : [])
      ];

      console.log('Total products loaded:', allProducts.length);

      if (allProducts.length === 0) {
        console.error('❌ No products loaded!');
        document.getElementById('productPage').innerHTML = `
          <div style="text-align:center;padding:80px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:20px;">
            <div style="font-size:60px;margin-bottom:20px;">⚠️</div>
            <h2 style="color:#D4AF37;font-size:28px;">No Products Loaded</h2>
            <p style="color:#888;margin:12px 0 24px;">Please check your data files.</p>
            <a href="index.html" style="display:inline-block;padding:14px 40px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:12px;text-decoration:none;font-weight:700;transition:all 0.3s ease;">Return to Store</a>
          </div>
        `;
        return;
      }

      loadProduct();
      updateCartBadge();
      console.log('=== INIT COMPLETE ===');
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(init, 200);
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(init, 200);
      });
    }

    window.addEventListener('load', function() {
      if (allProducts.length === 0) {
        setTimeout(init, 300);
      }
    });
  </script>

  <!-- ===== YOUR DATA FILES ===== -->
  <script src="config.js"></script>
  <script src="mobiles.js"></script>
  <script src="refrigerator.js"></script>
  <script src="washing.js"></script>
  <script src="ac.js"></script>
  <script src="tv.js"></script>

</body>
</html>
