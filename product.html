<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | JB STORE</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0 0 82px;
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.035), transparent 30%), #0a0a0a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    .product-header {
      width: 100%;
      height: 70px;
      padding: 0 clamp(18px, 4vw, 60px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.94);
      border-bottom: 1px solid rgba(212, 175, 55, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 16px;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.13);
      border-radius: 30px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .back-btn:hover {
      color: #fff;
      background: rgba(212, 175, 55, 0.12);
      border-color: rgba(212, 175, 55, 0.35);
      transform: translateX(-3px);
    }

    .product-logo {
      color: #d4af37;
      font-size: clamp(20px, 2vw, 28px);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .product-logo span {
      color: #fff;
      font-weight: 300;
    }

    .product-page {
      width: min(94%, 1380px);
      margin: 30px auto 40px;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: clamp(28px, 4vw, 52px);
      align-items: start;
      animation: fadeInUp 0.45s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-image-section {
      min-width: 0;
      position: relative;
    }

    .product-image-box {
      width: 100%;
      min-height: clamp(420px, 52vh, 590px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 30px;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.045), transparent 55%), linear-gradient(145deg, #181818, #0f0f0f);
      border: 1px solid rgba(212, 175, 55, 0.14);
      border-radius: 20px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35), inset 0 0 40px rgba(212, 175, 55, 0.015);
      transition: 0.35s ease;
    }

    .product-image-box:hover {
      border-color: rgba(212, 175, 55, 0.28);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.45), 0 0 35px rgba(212, 175, 55, 0.035);
    }

    .product-image-box img {
      display: block;
      width: auto;
      height: auto;
      max-width: 92%;
      max-height: 500px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
      transition: transform 0.35s ease;
    }

    .product-image-box:hover img {
      transform: scale(1.025);
    }

    .product-offer {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 5;
      padding: 6px 15px;
      background: linear-gradient(135deg, #d4af37, #f3cf55);
      color: #080808;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 22px rgba(212, 175, 55, 0.2);
    }

    .thumbnail-strip {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 3px 2px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 175, 55, 0.35) transparent;
    }

    .thumbnail-strip::-webkit-scrollbar {
      height: 3px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.35);
      border-radius: 10px;
    }

    .thumbnail-strip img {
      width: 70px;
      height: 70px;
      flex: 0 0 70px;
      padding: 7px;
      object-fit: contain;
      background: #0b0b0b;
      border: 1.5px solid rgba(255, 255, 255, 0.07);
      border-radius: 11px;
      cursor: pointer;
      scroll-snap-align: start;
      transition: 0.25s ease;
    }

    .thumbnail-strip img:hover {
      border-color: rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .thumbnail-strip img.active {
      border-color: #ffd700 !important;
      box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.15), 0 0 22px rgba(255, 215, 0, 0.12);
    }

    .variant-section {
      margin-top: 14px;
      padding: 17px 18px;
      background: linear-gradient(145deg, #181818, #111);
      border: 1px solid rgba(212, 175, 55, 0.09);
      border-radius: 15px;
    }

    .variant-section label {
      display: block;
      margin-bottom: 12px;
      color: #888;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .variant-section label span {
      color: #d4af37;
    }

    .variant-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }

    .variant-options .opt {
      min-width: 0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #101010;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      color: #bdbdbd;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .variant-options .opt:hover {
      color: #d4af37;
      border-color: rgba(212, 175, 55, 0.35);
      transform: translateY(-2px);
    }

    .variant-options .opt.active {
      color: #d4af37;
      background: rgba(212, 175, 55, 0.07);
      border-color: #ffd700;
      box-shadow: 0 5px 20px rgba(212, 175, 55, 0.08);
    }

    .variant-options .opt .variant-price {
      margin-top: 3px;
      color: #d4af37;
      font-size: 14px;
      font-weight: 700;
    }

    .product-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-card {
      width: 100%;
      min-width: 0;
      padding: 18px 20px;
      background: linear-gradient(145deg, #181818, #111);
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 15px;
      transition: 0.25s ease;
    }

    .info-card:hover {
      border-color: rgba(212, 175, 55, 0.12);
    }

    .product-brand {
      margin: 0 0 3px;
      color: #d4af37;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.75;
    }

    .product-name {
      margin: 0;
      color: #fff;
      font-size: clamp(22px, 2.2vw, 30px);
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .product-rating {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .product-rating .stars {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: linear-gradient(135deg, #388e3c, #43a047);
      color: #fff;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
    }

    .product-rating .review-count {
      color: #777;
      font-size: 12px;
    }

    .product-price {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .product-price .current {
      color: #d4af37;
      font-size: clamp(24px, 2.5vw, 32px);
      font-weight: 700;
    }

    .product-price .old {
      color: #666;
      font-size: 15px;
      text-decoration: line-through;
    }

    .product-price .discount-badge {
      padding: 3px 9px;
      color: #4ecdc4;
      background: rgba(78, 205, 196, 0.08);
      border: 1px solid rgba(78, 205, 196, 0.1);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .condition-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .condition-row span {
      color: #777;
      font-size: 12px;
    }

    .condition-row strong {
      padding: 3px 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      font-size: 12px;
    }

    .specs-section h2 {
      margin: 0 0 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }

    .specs-section h2::after {
      content: '';
      display: block;
      width: 32px;
      height: 2px;
      margin-top: 5px;
      background: linear-gradient(90deg, #d4af37, transparent);
      border-radius: 2px;
    }

    .spec-row {
      min-height: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.035);
      font-size: 12px;
    }

    .spec-row:last-child {
      border-bottom: none;
    }

    .spec-row span {
      color: #777;
    }

    .spec-row strong {
      max-width: 62%;
      color: #e8e8e8;
      font-weight: 500;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .warranty {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #ccc;
      font-size: 12px;
    }

    .warranty strong {
      padding: 3px 11px;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.06);
      border-radius: 20px;
      font-weight: 600;
    }

    .product-description {
      margin: 0;
      color: #b8b8b8;
      font-size: 13px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .product-actions button {
      min-height: 46px;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .whatsapp-btn {
      color: #fff;
      background: linear-gradient(135deg, #25d366, #1da851);
    }

    .call-btn {
      color: #0a0a0a;
      background: linear-gradient(135deg, #d4af37, #f3cf55);
    }

    .similar-products {
      min-width: 0;
    }

    .similar-products h3 {
      margin: 0 0 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }

    .similar-products h3 span {
      color: #d4af37;
    }

    .similar-scroll {
      display: flex;
      gap: 12px;
      padding: 3px 2px 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }

    .similar-item {
      min-width: 145px;
      flex: 0 0 145px;
      padding: 11px;
      background: linear-gradient(145deg, #181818, #111);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .similar-item img {
      width: 100%;
      height: 105px;
      display: block;
      padding: 7px;
      object-fit: contain;
      background: #0a0a0a;
      border-radius: 7px;
    }

    .similar-item .s-name {
      min-height: 34px;
      margin-top: 7px;
      color: #e8e8e8;
      font-size: 11px;
      font-weight: 500;
    }

    .similar-item .s-price {
      margin-top: 3px;
      color: #d4af37;
      font-size: 13px;
      font-weight: 600;
    }

    .sticky-cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999;
      min-height: 68px;
      padding: 9px clamp(15px, 4vw, 60px);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(13, 13, 13, 0.96);
      border-top: 1px solid rgba(212, 175, 55, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .sticky-cart-bar .price-tag {
      flex: 0 0 auto;
      color: #d4af37;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .sticky-cart-bar button {
      min-height: 44px;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .sticky-cart-bar .cart-btn,
    .sticky-cart-bar .buy-btn {
      flex: 1;
    }

    .sticky-cart-bar .cart-btn {
      color: #fff;
      background: linear-gradient(135deg, #25d366, #1da851);
    }

    .sticky-cart-bar .buy-btn {
      color: #0a0a0a;
      background: linear-gradient(135deg, #d4af37, #f3cf55);
    }

    @media (max-width: 900px) {
      .product-page {
        width: min(94%, 900px);
        grid-template-columns: 1fr;
        gap: 22px;
      }
      .product-image-box {
        min-height: 430px;
      }
      .product-image-box img {
        max-height: 380px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding-bottom: 74px;
      }
      .product-header {
        height: 54px;
        padding: 0 12px;
      }
      .product-logo {
        font-size: 19px;
      }
      .back-btn {
        padding: 6px 11px;
        font-size: 11px;
      }
      .product-page {
        width: 100%;
        margin: 12px auto 25px;
        padding: 0 10px;
        gap: 13px;
      }
      .product-image-box {
        min-height: 280px;
        padding: 16px;
        border-radius: 14px;
      }
      .product-image-box img {
        max-width: 94%;
        max-height: 245px;
      }
      .thumbnail-strip img {
        width: 54px;
        height: 54px;
        flex-basis: 54px;
      }
      .variant-section {
        margin-top: 9px;
        padding: 12px;
        border-radius: 11px;
      }
      .variant-options {
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
      }
      .info-card {
        padding: 12px 13px;
        border-radius: 11px;
      }
      .product-name {
        font-size: 18px;
      }
      .product-price .current {
        font-size: 22px;
      }
      .product-actions {
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .product-actions button {
        min-height: 40px;
        font-size: 10px;
      }
      .similar-item {
        min-width: 105px;
        flex-basis: 105px;
        padding: 7px;
      }
      .similar-item img {
        height: 76px;
      }
      .sticky-cart-bar {
        min-height: 62px;
        padding: 7px 10px;
        gap: 6px;
      }
      .sticky-cart-bar .price-tag {
        font-size: 15px;
      }
      .sticky-cart-bar .price-tag small {
        display: none;
      }
      .sticky-cart-bar button {
        min-height: 40px;
        font-size: 10px;
      }
    }

    @media (max-width: 420px) {
      .product-header {
        height: 50px;
        padding: 0 9px;
      }
      .product-logo {
        font-size: 17px;
      }
      .back-btn {
        padding: 5px 9px;
        font-size: 10px;
      }
      .product-page {
        padding: 0 8px;
        margin-top: 9px;
        gap: 10px;
      }
      .product-image-box {
        min-height: 235px;
        padding: 12px;
        border-radius: 12px;
      }
      .product-image-box img {
        max-height: 200px;
      }
      .thumbnail-strip img {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }
      .product-name {
        font-size: 16px;
      }
      .product-price .current {
        font-size: 20px;
      }
      .similar-item {
        min-width: 96px;
        flex-basis: 96px;
      }
      .similar-item img {
        height: 68px;
      }
      .sticky-cart-bar {
        padding: 6px 8px;
      }
      .sticky-cart-bar .price-tag {
        font-size: 13px;
      }
      .sticky-cart-bar button {
        min-height: 37px;
        font-size: 9px;
      }
    }

    @media (max-width: 350px) {
      .product-logo {
        font-size: 15px;
      }
      .back-btn {
        font-size: 9px;
        padding: 4px 7px;
      }
      .product-image-box {
        min-height: 205px;
      }
      .product-image-box img {
        max-height: 175px;
      }
      .product-name {
        font-size: 15px;
      }
      .product-price .current {
        font-size: 18px;
      }
      .sticky-cart-bar .price-tag {
        font-size: 12px;
      }
      .sticky-cart-bar button {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <header class="product-header">
    <a href="index.html" class="back-btn">← Back</a>
    <div class="product-logo">JB <span>STORE</span></div>
  </header>

  <main class="product-page" id="productPage">

    <div class="product-image-section">
      <div class="product-image-box">
        <span id="productOffer" class="product-offer"></span>
        <img id="productImage" src="" alt="Product">
      </div>

      <div class="thumbnail-strip" id="thumbnailStrip"></div>

      <div class="variant-section">
        <label>📱 Select <span>Variant</span></label>
        <div class="variant-options" id="variantOptions"></div>
      </div>
    </div>

    <div class="product-info">

      <div class="info-card">
        <p id="productBrand" class="product-brand"></p>
        <h1 id="productName" class="product-name"></h1>
        <div class="product-rating">
          <span class="stars" id="productRating">⭐ 4.5</span>
          <span class="review-count" id="productReviews">(0 reviews)</span>
        </div>
        <div class="product-price">
          <span class="current" id="productPrice">₹0</span>
          <span class="old" id="productOldPrice">₹0</span>
          <span class="discount-badge" id="productDiscount"></span>
        </div>
        <div class="condition-row">
          <span>Condition</span>
          <strong id="productCondition">New</strong>
        </div>
      </div>

      <div class="info-card specs-section">
        <h2>📋 Specifications</h2>
        <div id="specList"></div>
      </div>

      <div class="info-card warranty">
        🛡️ Warranty: <strong id="productWarranty">1 Year</strong>
      </div>

      <div class="info-card">
        <p id="productDescription" class="product-description"></p>
      </div>

      <div class="info-card" style="border-color:rgba(212,175,55,0.05);">
        <div class="product-actions">
          <button class="whatsapp-btn" onclick="contactWhatsApp()">💬 WhatsApp Enquiry</button>
          <button class="call-btn" onclick="callStore()">📞 Call Store</button>
        </div>
      </div>

      <div class="similar-products">
        <h3>🔄 Similar <span>Products</span></h3>
        <div class="similar-scroll" id="similarScroll"></div>
      </div>

    </div>

  </main>

  <div class="sticky-cart-bar">
    <span class="price-tag" id="stickyPrice">₹0 <small>₹0</small></span>
    <button class="cart-btn" onclick="addToCartFromProduct()">🛒 Add to Cart</button>
    <button class="buy-btn" onclick="buyNow()">⚡ Buy Now</button>
  </div>

  <!-- ===== SCRIPTS - ORDER IS IMPORTANT ===== -->
  <script src="config.js"></script>
  <script src="mobiles.js"></script>
  <script src="refrigerator.js"></script>
  <script src="washing.js"></script>
  <script src="ac.js"></script>
  <script src="tv.js"></script>

  <script>
  

    // ==========================================
    // ALL PRODUCTS
    // ==========================================
    let allProducts = [];

    // ==========================================
    // TOAST
    // ==========================================
    function showToast(msg) {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      toast.innerHTML = `
        <span>${msg}</span>
        <button onclick="this.parentElement.remove()">✕</button>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ==========================================
    // GET PRODUCT ID FROM URL
    // ==========================================
    function getProductIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || params.get('product') || params.get('p');
    }

    // ==========================================
    // LOAD PRODUCT
    // ==========================================
    function loadProduct() {
      console.log('Loading product...');
      console.log('All products count:', allProducts.length);

      let productId = getProductIdFromURL();
      console.log('Product ID from URL:', productId);

      let productData = null;

      if (productId) {
        productData = allProducts.find(p => p.id === productId);
        console.log('Product found by ID:', productData);
      }

      if (!productData) {
        const saved = JSON.parse(localStorage.getItem('selectedProduct'));
        console.log('Saved product from localStorage:', saved);
        if (saved) {
          productData = allProducts.find(p => p.id === saved.id);
          console.log('Product found by saved ID:', productData);
        }
      }

      if (!productData && allProducts.length > 0) {
        productData = allProducts[0];
        console.log('Using first product as fallback:', productData);
      }

      if (!productData) {
        console.error('No product found!');
        document.getElementById('productPage').innerHTML = `
          <div style="text-align:center;padding:60px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:16px;">
            <div style="font-size:50px;margin-bottom:16px;">🔍</div>
            <h2 style="color:#D4AF37;font-size:24px;">Product Not Found</h2>
            <p style="color:#888;margin:8px 0 20px;font-size:14px;">The product you're looking for doesn't exist.</p>
            <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
          </div>
        `;
        return;
      }

      window.currentProduct = productData;
      renderProduct(productData);
    }

    // ==========================================
    // RENDER PRODUCT
    // ==========================================
    function renderProduct(product) {
      console.log('Rendering product:', product);
      document.title = product.name + ' | JB STORE';

      // Image
      const img = document.getElementById('productImage');
      if (img) {
        const imageSrc = product.image || product.images?.[0] || 'images/placeholder.png';
        img.src = imageSrc;
        img.alt = product.name || '';
        console.log('Image set to:', imageSrc);
      }

      // Name
      document.getElementById('productName').innerText = product.name || '';
      
      // Brand
      document.getElementById('productBrand').innerText = product.brand || '';

      // Rating
      document.getElementById('productRating').innerHTML = `⭐ ${product.rating || '4.5'}`;
      document.getElementById('productReviews').innerText = `(${product.reviews || '0'} reviews)`;

      // Price
      const price = product.price || 0;
      const oldPrice = product.oldPrice || price * 1.3;
      document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
      document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;

      const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
      document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';

      // Condition
      document.getElementById('productCondition').innerText = product.condition || 'New';
      
      // Warranty
      document.getElementById('productWarranty').innerText = product.warranty || '1 Year';
      
      // Description
      document.getElementById('productDescription').innerText = product.description || '';
      
      // Offer
      document.getElementById('productOffer').innerText = product.discount || '';

      // Sticky Price
      document.getElementById('stickyPrice').innerHTML =
        `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;

      // Specifications
      const specList = document.getElementById('specList');
      specList.innerHTML = '';
      const specMap = {
        'Brand': product.brand,
        'Storage': product.storage,
        'RAM': product.ram,
        'Capacity': product.capacity,
        'Type': product.type,
        'Energy Rating': product.energyRating,
        'Size': product.size,
        'Resolution': product.resolution,
        'Color': product.color,
        'Model': product.model,
        'Weight': product.weight,
        'Dimensions': product.dimensions,
        'Condition': product.condition
      };

      let hasSpecs = false;
      for (const [key, val] of Object.entries(specMap)) {
        if (val) {
          hasSpecs = true;
          specList.innerHTML += `
            <div class="spec-row">
              <span>${key}</span>
              <strong>${val}</strong>
            </div>
          `;
        }
      }
      if (!hasSpecs) {
        specList.innerHTML = `<div style="color:#666;text-align:center;padding:8px 0;font-size:13px;">No specifications available</div>`;
      }

      // Thumbnails
      const thumbStrip = document.getElementById('thumbnailStrip');
      thumbStrip.innerHTML = '';
      const images = product.images || [product.image];
      images.forEach((img, idx) => {
        if (!img) return;
        const el = document.createElement('img');
        el.src = img;
        el.className = idx === 0 ? 'active' : '';
        el.onclick = () => {
          document.getElementById('productImage').src = img;
          document.querySelectorAll('.thumbnail-strip img').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
        };
        thumbStrip.appendChild(el);
      });

      loadVariants(product);
      loadSimilarProducts(product);
      
      console.log('Product rendered successfully!');
    }

    // ==========================================
    // UPDATE PRICE
    // ==========================================
    let selectedVariantLabel = null;
    let selectedVariantPrice = 0;
    let selectedVariantOldPrice = 0;

    function updateProductPrice(price, oldPrice, variantLabel) {
      selectedVariantLabel = variantLabel;
      selectedVariantPrice = price;
      selectedVariantOldPrice = oldPrice;

      document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
      document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
      const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
      document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
      document.getElementById('stickyPrice').innerHTML =
        `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;
    }

    // ==========================================
    // LOAD VARIANTS
    // ==========================================
    function loadVariants(product) {
      const container = document.getElementById('variantOptions');
      container.innerHTML = '';

      const variants = product.variants || [
        { label: 'Default', price: product.price, oldPrice: product.oldPrice || product.price * 1.3 }
      ];

      variants.forEach((variant, index) => {
        const el = document.createElement('button');
        el.className = 'opt' + (index === 0 ? ' active' : '');
        el.innerHTML = `
          <span>${variant.label}</span>
          <span class="variant-price">₹${variant.price.toLocaleString('en-IN')}</span>
        `;
        el.dataset.price = variant.price;
        el.dataset.oldPrice = variant.oldPrice || variant.price * 1.3;
        el.dataset.label = variant.label;

        if (index === 0) {
          selectedVariantLabel = variant.label;
          selectedVariantPrice = variant.price;
          selectedVariantOldPrice = variant.oldPrice || variant.price * 1.3;
        }

        el.addEventListener('click', function() {
          document.querySelectorAll('.variant-options .opt').forEach(o => o.classList.remove('active'));
          this.classList.add('active');
          const price = parseInt(this.dataset.price);
          const oldPrice = parseInt(this.dataset.oldPrice);
          const label = this.dataset.label;
          updateProductPrice(price, oldPrice, label);
          showToast(`Selected: ${label}`);
        });

        container.appendChild(el);
      });
    }

    // ==========================================
    // SIMILAR PRODUCTS
    // ==========================================
    function loadSimilarProducts(product) {
      const similar = allProducts
        .filter(p => p.id !== product.id && p.category === product.category)
        .slice(0, 6);

      const container = document.getElementById('similarScroll');
      container.innerHTML = '';

      if (similar.length === 0) {
        container.innerHTML = '<p style="color:#666;font-size:13px;padding:8px 0;">No similar products found.</p>';
        return;
      }

      similar.forEach(p => {
        const div = document.createElement('div');
        div.className = 'similar-item';
        div.onclick = () => {
          window.location.href = `product.html?id=${p.id}`;
        };
        div.innerHTML = `
          <img src="${p.image || p.images?.[0] || ''}" alt="${p.name}">
          <div class="s-name">${p.name}</div>
          <div class="s-price">₹${(p.price || 0).toLocaleString('en-IN')}</div>
        `;
        container.appendChild(div);
      });
    }

    // ==========================================
    // ACTIONS
    // ==========================================
    function contactWhatsApp() {
      const product = window.currentProduct;
      if (!product) return;
      const price = document.getElementById('productPrice').innerText;
      const msg = `Hello JB STORE, I am interested in ${product.name} (${selectedVariantLabel || 'Default'}). Price: ${price}.`;
      window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function callStore() {
      window.location.href = `tel:${STORE_PHONE}`;
    }

    function addToCartFromProduct() {
      const product = window.currentProduct;
      if (!product) {
        showToast('Product not found!');
        return;
      }

      const variantLabel = selectedVariantLabel || 'Default';
      const price = selectedVariantPrice || product.price;

      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      const uniqueId = `${product.id}_${variantLabel}`;
      const existingItem = cart.find(item => item.id === uniqueId);

      const displayName = variantLabel !== 'Default' ? `${product.name} (${variantLabel})` : product.name;

      if (existingItem) {
        existingItem.quantity += 1;
        showToast(`📦 ${displayName} quantity updated!`);
      } else {
        cart.push({
          id: uniqueId,
          name: product.name,
          brand: product.brand,
          price: price,
          image: product.image || product.images?.[0] || '',
          quantity: 1,
          variant: variantLabel
        });
        showToast(`✅ ${displayName} added to cart!`);
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function buyNow() {
      addToCartFromProduct();
      setTimeout(() => {
        window.location.href = 'cart.html';
      }, 600);
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const total = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.querySelectorAll('.cart-badge').forEach(b => {
        b.textContent = total;
        b.style.display = total > 0 ? 'flex' : 'none';
      });
    }

    // ==========================================
    // INIT - LOAD ALL PRODUCTS FIRST
    // ==========================================
    function init() {
      console.log('Initializing product page...');
      
      // Load all products from data files
      allProducts = [
        ...(typeof mobileProducts !== "undefined" ? mobileProducts : []),
        ...(typeof refrigeratorProducts !== "undefined" ? refrigeratorProducts : []),
        ...(typeof washingProducts !== "undefined" ? washingProducts : []),
        ...(typeof acProducts !== "undefined" ? acProducts : []),
        ...(typeof tvProducts !== "undefined" ? tvProducts : [])
      ];

      console.log('All products loaded:', allProducts.length);

      if (allProducts.length === 0) {
        console.error('No products loaded!');
        document.getElementById('productPage').innerHTML = `
          <div style="text-align:center;padding:60px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:16px;">
            <div style="font-size:50px;margin-bottom:16px;">⚠️</div>
            <h2 style="color:#D4AF37;font-size:24px;">No Products Loaded</h2>
            <p style="color:#888;margin:8px 0 20px;font-size:14px;">Please check your data files.</p>
            <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
          </div>
        `;
        return;
      }

      loadProduct();
      updateCartBadge();
    }

    // ==========================================
    // START
    // ==========================================
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(init, 100);
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(init, 100);
      });
    }

    // Fallback: If scripts load late, try again
    window.addEventListener('load', function() {
      if (allProducts.length === 0) {
        console.log('Retrying init on load...');
        setTimeout(init, 200);
      }
    });
  </script>

</body>
