<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | JB STORE</title>

    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ── RESET & BASE ── */
        * {
            box-sizing: border-box;
        }
        html {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            padding: 0 0 82px;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.035), transparent 30%), #0a0a0a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        .product-header {
            width: 100%;
            height: 70px;
            padding: 0 clamp(18px, 4vw, 60px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.94);
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(18px);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.13);
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.25s ease;
        }
        .back-btn:hover {
            color: #fff;
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateX(-3px);
        }
        .product-logo {
            color: #d4af37;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .product-logo span {
            color: #fff;
            font-weight: 300;
        }

        /* ── MAIN GRID ── */
        .product-page {
            width: min(94%, 1380px);
            margin: 30px auto 40px;
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
            gap: clamp(28px, 4vw, 52px);
            align-items: start;
            animation: fadeInUp 0.45s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── IMAGE SECTION ── */
        .product-image-section {
            min-width: 0;
            position: relative;
        }
        .product-image-box {
            width: 100%;
            min-height: clamp(420px, 52vh, 590px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 30px;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.045), transparent 55%), linear-gradient(145deg, #181818, #0f0f0f);
            border: 1px solid rgba(212, 175, 55, 0.14);
            border-radius: 20px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
            transition: 0.35s ease;
        }
        .product-image-box:hover {
            border-color: rgba(212, 175, 55, 0.28);
        }
        .product-image-box img {
            display: block;
            width: auto;
            height: auto;
            max-width: 92%;
            max-height: 500px;
            object-fit: contain;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
            transition: transform 0.35s ease;
        }
        .product-image-box:hover img {
            transform: scale(1.025);
        }
        .product-offer {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 5;
            padding: 6px 15px;
            background: linear-gradient(135deg, #d4af37, #f3cf55);
            color: #080808;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.2);
        }

        /* ── THUMBNAIL STRIP (Flipkart style: NO boxes, pure images) ── */
        .thumbnail-strip {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding: 4px 2px 8px 2px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.3) transparent;
        }
        .thumbnail-strip::-webkit-scrollbar {
            height: 3px;
        }
        .thumbnail-strip::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.4);
            border-radius: 10px;
        }
        .thumbnail-strip img {
            width: 72px;
            height: 72px;
            flex: 0 0 72px;
            object-fit: contain;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            scroll-snap-align: start;
            transition: 0.25s ease;
            background: transparent;
            /* No background box */
            padding: 0;
            /* No padding */
        }
        .thumbnail-strip img:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }
        .thumbnail-strip img.active-thumb {
            border-color: #ffd700 !important;
            box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.2), 0 0 18px rgba(255, 215, 0, 0.08);
        }

        /* ── COLOR SECTION ── */
        .color-section {
            margin-top: 14px;
            padding: 17px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.09);
            border-radius: 15px;
        }
        .color-section label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }
        .color-section label span {
            color: #d4af37;
        }
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 20px;
        }
        .color-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: 0.25s ease;
            min-width: 70px;
        }
        .color-opt .swatch {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            background: #0b0b0b;
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: 0.25s ease;
            padding: 4px;
        }
        .color-opt:hover .swatch {
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }
        .color-opt.active .swatch {
            border-color: #ffd700 !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.15), 0 0 24px rgba(255, 215, 0, 0.13);
        }
        .color-opt .color-name {
            color: #bdbdbd;
            font-size: 10px;
            font-weight: 500;
            text-align: center;
            line-height: 1.3;
            word-break: break-word;
            max-width: 80px;
            white-space: normal;
            overflow: visible;
        }
        .color-opt.active .color-name {
            color: #d4af37;
        }

        /* ── VARIANT SECTION ── */
        .variant-section {
            margin-top: 10px;
            padding: 17px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.09);
            border-radius: 15px;
        }
        .variant-section label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }
        .variant-section label span {
            color: #d4af37;
        }
        .variant-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .variant-options .opt {
            min-width: 0;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #101010;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            color: #bdbdbd;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .variant-options .opt:hover {
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }
        .variant-options .opt.active {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.07);
            border-color: #ffd700;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.08);
        }
        .variant-options .opt .variant-price {
            margin-top: 3px;
            color: #d4af37;
            font-size: 14px;
            font-weight: 700;
        }

        /* ── INFO CARDS ── */
        .product-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .info-card {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 15px;
            transition: 0.25s ease;
        }
        .info-card:hover {
            border-color: rgba(212, 175, 55, 0.12);
        }
        .product-brand {
            margin: 0 0 3px;
            color: #d4af37;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.75;
        }
        .product-name {
            margin: 0;
            color: #fff;
            font-size: clamp(22px, 2.2vw, 30px);
            font-weight: 700;
            line-height: 1.25;
        }
        .product-rating {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .product-rating .stars {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            background: linear-gradient(135deg, #388e3c, #43a047);
            color: #fff;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }
        .product-rating .review-count {
            color: #777;
            font-size: 12px;
        }
        .product-price {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .product-price .current {
            color: #d4af37;
            font-size: clamp(24px, 2.5vw, 32px);
            font-weight: 700;
        }
        .product-price .old {
            color: #666;
            font-size: 15px;
            text-decoration: line-through;
        }
        .product-price .discount-badge {
            padding: 3px 9px;
            color: #4ecdc4;
            background: rgba(78, 205, 196, 0.08);
            border: 1px solid rgba(78, 205, 196, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .condition-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .condition-row span {
            color: #777;
            font-size: 12px;
        }
        .condition-row strong {
            padding: 3px 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 12px;
        }
        .specs-section h2 {
            margin: 0 0 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }
        .specs-section h2::after {
            content: '';
            display: block;
            width: 32px;
            height: 2px;
            margin-top: 5px;
            background: linear-gradient(90deg, #d4af37, transparent);
            border-radius: 2px;
        }
        .spec-row {
            min-height: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.035);
            font-size: 12px;
        }
        .spec-row:last-child {
            border-bottom: none;
        }
        .spec-row span {
            color: #777;
        }
        .spec-row strong {
            max-width: 62%;
            color: #e8e8e8;
            font-weight: 500;
            text-align: right;
        }
        .warranty {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            color: #ccc;
            font-size: 12px;
        }
        .warranty strong {
            padding: 3px 11px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.06);
            border-radius: 20px;
            font-weight: 600;
        }
        .product-description {
            margin: 0;
            color: #b8b8b8;
            font-size: 13px;
            line-height: 1.75;
        }
        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .product-actions button {
            min-height: 46px;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .whatsapp-btn {
            color: #fff;
            background: linear-gradient(135deg, #25d366, #1da851);
        }
        .call-btn {
            color: #0a0a0a;
            background: linear-gradient(135deg, #d4af37, #f3cf55);
        }

        /* ── SIMILAR ── */
        .similar-products {
            min-width: 0;
        }
        .similar-products h3 {
            margin: 0 0 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .similar-products h3 span {
            color: #d4af37;
        }
        .similar-scroll {
            display: flex;
            gap: 12px;
            padding: 3px 2px 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
        }
        .similar-item {
            min-width: 145px;
            flex: 0 0 145px;
            padding: 11px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            scroll-snap-align: start;
        }
        .similar-item img {
            width: 100%;
            height: 105px;
            display: block;
            padding: 7px;
            object-fit: contain;
            background: #0a0a0a;
            border-radius: 7px;
        }
        .similar-item .s-name {
            min-height: 34px;
            margin-top: 7px;
            color: #e8e8e8;
            font-size: 11px;
            font-weight: 500;
        }
        .similar-item .s-price {
            margin-top: 3px;
            color: #d4af37;
            font-size: 13px;
            font-weight: 600;
        }

        /* ── STICKY BAR ── */
        .sticky-cart-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 999;
            min-height: 68px;
            padding: 9px clamp(15px, 4vw, 60px);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(13, 13, 13, 0.96);
            border-top: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(18px);
        }
        .sticky-cart-bar .price-tag {
            flex: 0 0 auto;
            color: #d4af37;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }
        .sticky-cart-bar button {
            min-height: 44px;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .sticky-cart-bar .cart-btn,
        .sticky-cart-bar .buy-btn {
            flex: 1;
        }
        .sticky-cart-bar .cart-btn {
            color: #fff;
            background: linear-gradient(135deg, #25d366, #1da851);
        }
        .sticky-cart-bar .buy-btn {
            color: #0a0a0a;
            background: linear-gradient(135deg, #d4af37, #f3cf55);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .product-page {
                grid-template-columns: 1fr;
                gap: 22px;
            }
            .product-image-box {
                min-height: 300px;
            }
            .product-image-box img {
                max-height: 280px;
            }
            .thumbnail-strip img {
                width: 56px;
                height: 56px;
                flex: 0 0 56px;
            }
            .color-opt .swatch {
                width: 44px;
                height: 44px;
            }
            .variant-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 420px) {
            .product-image-box {
                min-height: 240px;
            }
            .product-image-box img {
                max-height: 210px;
            }
            .thumbnail-strip img {
                width: 48px;
                height: 48px;
                flex: 0 0 48px;
            }
            .color-opt .swatch {
                width: 38px;
                height: 38px;
            }
            .sticky-cart-bar .price-tag {
                font-size: 15px;
            }
            .sticky-cart-bar button {
                font-size: 10px;
                min-height: 40px;
            }
        }
    </style>
</head>

<body>

    <header class="product-header">
        <a href="index.html" class="back-btn">← Back</a>
        <div class="product-logo">JB <span>STORE</span></div>
    </header>

    <main class="product-page" id="productPage">

        <div class="product-image-section">

            <!-- Main Image Box -->
            <div class="product-image-box">
                <span id="productOffer" class="product-offer"></span>
                <img id="productImage" src="" alt="Product" />
            </div>

            <!-- Thumbnail Strip (Flipkart style: pure images, no boxes) -->
            <div class="image-dots" id="imageDots"></div>

            <!-- Color Selection -->
            <div class="color-section" id="colorSection">
                <label>🎨 Select <span>Color</span></label>
                <div class="color-options" id="colorOptions"></div>
            </div>

            <!-- Variant Selection -->
            <div class="variant-section">
                <label>📱 Select <span>Variant</span></label>
                <div class="variant-options" id="variantOptions"></div>
            </div>

        </div>

        <!-- Right Column -->
        <div class="product-info">
            <div class="info-card">
                <p id="productBrand" class="product-brand"></p>
                <h1 id="productName" class="product-name"></h1>
                <div class="product-rating">
                    <span class="stars" id="productRating">⭐ 4.5</span>
                    <span class="review-count" id="productReviews">(0 reviews)</span>
                </div>
                <div class="product-price">
                    <span class="current" id="productPrice">₹0</span>
                    <span class="old" id="productOldPrice">₹0</span>
                    <span class="discount-badge" id="productDiscount"></span>
                </div>
                <div class="condition-row">
                    <span>Condition</span>
                    <strong id="productCondition">New</strong>
                </div>
            </div>

            <div class="info-card specs-section">
                <h2>📋 Specifications</h2>
                <div id="specList"></div>
            </div>

            <div class="info-card warranty">
                🛡️ Warranty: <strong id="productWarranty">1 Year</strong>
            </div>

            <div class="info-card">
                <p id="productDescription" class="product-description"></p>
            </div>

            <div class="info-card" style="border-color:rgba(212,175,55,0.05);">
                <div class="product-actions">
                    <button class="whatsapp-btn" onclick="contactWhatsApp()">💬 WhatsApp Enquiry</button>
                    <button class="call-btn" onclick="callStore()">📞 Call Store</button>
                </div>
            </div>

            <div class="similar-products">
                <h3>🔄 Similar <span>Products</span></h3>
                <div class="similar-scroll" id="similarScroll"></div>
            </div>
        </div>

    </main>

    <!-- Sticky Bar -->
    <div class="sticky-cart-bar">
        <span class="price-tag" id="stickyPrice">₹0 <small>₹0</small></span>
        <button class="cart-btn" onclick="addToCartFromProduct()">🛒 Add to Cart</button>
        <button class="buy-btn" onclick="buyNow()">⚡ Buy Now</button>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="mobiles.js"></script>
    <script src="refrigerator.js"></script>
    <script src="washing.js"></script>
    <script src="ac.js"></script>
    <script src="tv.js"></script>

    <script>
        // ==========================================
        // ALL PRODUCTS
        // ==========================================
        let allProducts = [];
        let currentProduct = null;
        let selectedColorName = null;
        let selectedVariantLabel = null;
        let selectedVariantPrice = 0;
        let selectedVariantOldPrice = 0;

        // ==========================================
        // TOAST
        // ==========================================
        function showToast(msg) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()">✕</button>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // GET PRODUCT ID
        // ==========================================
        function getProductIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || params.get('product') || params.get('p');
        }

        // ==========================================
        // UPDATE GALLERY (Flipkart style – no boxes, auto-hide missing images)
        // ==========================================
        function updateGallery(images) {
            const strip = document.getElementById('thumbnailStrip');
            const mainImg = document.getElementById('productImage');
            strip.innerHTML = '';

            if (!images || images.length === 0) {
                strip.style.display = 'none';
                return;
            }
            strip.style.display = 'flex';

            let hasValidImage = false;

            images.forEach((src) => {
                if (!src) return;

                const thumb = document.createElement('img');
                thumb.src = src;
                thumb.alt = 'Thumbnail';
                thumb.className = 'thumb-item';

                // If image fails to load, hide it instantly (no broken icon)
                thumb.onerror = function() {
                    this.style.display = 'none';
                };

                // If image loads successfully, mark it
                thumb.onload = function() {
                    hasValidImage = true;
                    // If main image is still placeholder, set it
                    if (mainImg.src === '' || mainImg.src === window.location.href || mainImg.src.includes('placeholder')) {
                        mainImg.src = this.src;
                    }
                };

                thumb.addEventListener('click', function() {
                    // Ignore clicks on hidden (broken) images
                    if (this.style.display === 'none') return;
                    document.querySelectorAll('.thumbnail-strip img').forEach(t => t.classList.remove('active-thumb'));
                    this.classList.add('active-thumb');
                    mainImg.src = this.src;
                });

                strip.appendChild(thumb);
            });

            // After a small delay, find the first visible image and set it as active
            setTimeout(() => {
                const visibleThumbs = strip.querySelectorAll('.thumb-item:not([style*="display: none"])');
                if (visibleThumbs.length > 0) {
                    // Remove active from all
                    strip.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active-thumb'));
                    // Set first visible as active
                    visibleThumbs[0].classList.add('active-thumb');
                    // If main image not set yet, set it
                    if (mainImg.src === '' || mainImg.src === window.location.href || mainImg.src.includes('placeholder')) {
                        mainImg.src = visibleThumbs[0].src;
                    }
                } else {
                    // If all images are broken, hide the strip
                    strip.style.display = 'none';
                }
            }, 150);
        }

        // ==========================================
        // LOAD COLORS
        // ==========================================
        function loadColors(product) {
            const container = document.getElementById('colorOptions');
            const section = document.getElementById('colorSection');
            container.innerHTML = '';

            const colors = product.colors || [];
            if (!colors || colors.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';

            // Determine first color's images
            let firstImages = [];
            if (colors[0].images && colors[0].images.length > 0) {
                firstImages = colors[0].images;
            } else if (colors[0].image) {
                firstImages = [colors[0].image];
            }
            updateGallery(firstImages);

            colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'color-opt' + (index === 0 ? ' active' : '');
                btn.dataset.index = index;

                let colorImages = [];
                if (color.images && color.images.length > 0) {
                    colorImages = color.images;
                } else if (color.image) {
                    colorImages = [color.image];
                }

                const swatch = document.createElement('img');
                swatch.className = 'swatch';
                swatch.src = colorImages[0] || '';
                swatch.alt = color.name || '';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'color-name';
                nameSpan.textContent = color.name || '';

                btn.appendChild(swatch);
                btn.appendChild(nameSpan);

                btn.addEventListener('click', function() {
                    document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    selectedColorName = this.querySelector('.color-name').textContent;
                    updateGallery(colorImages);
                    showToast(`Selected: ${selectedColorName}`);
                });

                container.appendChild(btn);
            });
        }

        // ==========================================
        // LOAD VARIANTS
        // ==========================================
        function loadVariants(product) {
            const container = document.getElementById('variantOptions');
            container.innerHTML = '';
            const variants = product.variants || [
                { label: 'Default', price: product.price, oldPrice: product.oldPrice || product.price * 1.3 }
            ];

            variants.forEach((variant, index) => {
                const el = document.createElement('button');
                el.className = 'opt' + (index === 0 ? ' active' : '');
                el.innerHTML = `
                            <span>${variant.label}</span>
                            <span class="variant-price">₹${variant.price.toLocaleString('en-IN')}</span>
                        `;
                el.dataset.price = variant.price;
                el.dataset.oldPrice = variant.oldPrice || variant.price * 1.3;
                el.dataset.label = variant.label;

                if (index === 0) {
                    selectedVariantLabel = variant.label;
                    selectedVariantPrice = variant.price;
                    selectedVariantOldPrice = variant.oldPrice || variant.price * 1.3;
                }

                el.addEventListener('click', function() {
                    document.querySelectorAll('.variant-options .opt').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const price = parseInt(this.dataset.price);
                    const oldPrice = parseInt(this.dataset.oldPrice);
                    const label = this.dataset.label;
                    updateProductPrice(price, oldPrice, label);
                    showToast(`Selected: ${label}`);
                });
                container.appendChild(el);
            });
        }

        // ==========================================
        // UPDATE PRICE
        // ==========================================
        function updateProductPrice(price, oldPrice, variantLabel) {
            selectedVariantLabel = variantLabel;
            selectedVariantPrice = price;
            selectedVariantOldPrice = oldPrice;
            document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
            document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
            const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
            document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
            document.getElementById('stickyPrice').innerHTML =
                `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;
        }

        // ==========================================
        // LOAD SIMILAR
        // ==========================================
        function loadSimilarProducts(product) {
            const similar = allProducts.filter(p => p.id !== product.id && p.category === product.category).slice(0, 6);
            const container = document.getElementById('similarScroll');
            container.innerHTML = '';
            if (similar.length === 0) {
                container.innerHTML = '<p style="color:#666;font-size:13px;padding:8px 0;">No similar products found.</p>';
                return;
            }
            similar.forEach(p => {
                const div = document.createElement('div');
                div.className = 'similar-item';
                div.onclick = () => window.location.href = `product.html?id=${p.id}`;
                div.innerHTML = `
                            <img src="${p.image || p.images?.[0] || ''}" alt="${p.name}">
                            <div class="s-name">${p.name}</div>
                            <div class="s-price">₹${(p.price || 0).toLocaleString('en-IN')}</div>
                        `;
                container.appendChild(div);
            });
        }

        // ==========================================
        // RENDER PRODUCT
        // ==========================================
        function renderProduct(product) {
            currentProduct = product;
            document.title = product.name + ' | JB STORE';

            // Basic info
            document.getElementById('productName').innerText = product.name || '';
            document.getElementById('productBrand').innerText = product.brand || '';
            document.getElementById('productRating').innerHTML = `⭐ ${product.rating || '4.5'}`;
            document.getElementById('productReviews').innerText = `(${product.reviews || '0'} reviews)`;
            document.getElementById('productCondition').innerText = product.condition || 'New';
            document.getElementById('productWarranty').innerText = product.warranty || '1 Year';
            document.getElementById('productDescription').innerText = product.description || '';
            document.getElementById('productOffer').innerText = product.discount || '';

            // Prices
            const price = product.price || 0;
            const oldPrice = product.oldPrice || price * 1.3;
            document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
            document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
            const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
            document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
            document.getElementById('stickyPrice').innerHTML =
                `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;

            // Specs
            const specList = document.getElementById('specList');
            specList.innerHTML = '';
            const specMap = {
                'Brand': product.brand,
                'Storage': product.storage,
                'RAM': product.ram,
                'Capacity': product.capacity,
                'Type': product.type,
                'Energy Rating': product.energyRating,
                'Size': product.size,
                'Resolution': product.resolution,
                'Color': product.color,
                'Model': product.model,
                'Weight': product.weight,
                'Dimensions': product.dimensions,
                'Condition': product.condition
            };
            let hasSpecs = false;
            for (const [key, val] of Object.entries(specMap)) {
                if (val) {
                    hasSpecs = true;
                    specList.innerHTML += `<div class="spec-row"><span>${key}</span><strong>${val}</strong></div>`;
                }
            }
            if (!hasSpecs) {
                specList.innerHTML =
                    `<div style="color:#666;text-align:center;padding:8px 0;font-size:13px;">No specifications available</div>`;
            }

            // Load dynamic sections
            loadColors(product);
            loadVariants(product);
            loadSimilarProducts(product);
        }

        // ==========================================
        // LOAD PRODUCT
        // ==========================================
        function loadProduct() {
            let productId = getProductIdFromURL();
            let productData = null;

            if (productId) {
                productData = allProducts.find(p => p.id === productId);
            }
            if (!productData) {
                const saved = JSON.parse(localStorage.getItem('selectedProduct'));
                if (saved) {
                    productData = allProducts.find(p => p.id === saved.id);
                }
            }
            if (!productData && allProducts.length > 0) {
                productData = allProducts[0];
            }

            if (!productData) {
                document.getElementById('productPage').innerHTML = `
                            <div style="text-align:center;padding:60px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:16px;">
                                <div style="font-size:50px;margin-bottom:16px;">🔍</div>
                                <h2 style="color:#D4AF37;font-size:24px;">Product Not Found</h2>
                                <p style="color:#888;margin:8px 0 20px;font-size:14px;">The product you're looking for doesn't exist.</p>
                                <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
                            </div>
                        `;
                return;
            }
            renderProduct(productData);
        }

        // ==========================================
        // ACTIONS
        // ==========================================
        function contactWhatsApp() {
            if (!currentProduct) return;
            const price = document.getElementById('productPrice').innerText;
            const color = selectedColorName ? ` (Color: ${selectedColorName})` : '';
            const variant = selectedVariantLabel ? ` (Variant: ${selectedVariantLabel})` : '';
            const msg =
                `Hello JB STORE, I am interested in ${currentProduct.name}${color}${variant}. Price: ${price}.`;
            window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function callStore() {
            window.location.href = `tel:${STORE_PHONE}`;
        }

        function addToCartFromProduct() {
            if (!currentProduct) {
                showToast('Product not found!');
                return;
            }
            const variantLabel = selectedVariantLabel || 'Default';
            const price = selectedVariantPrice || currentProduct.price;
            const colorName = selectedColorName || '';

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const variantKey = variantLabel !== 'Default' ? `_${variantLabel}` : '';
            const colorKey = colorName ? `_${colorName}` : '';
            const uniqueId = `${currentProduct.id}${variantKey}${colorKey}`;
            const existingItem = cart.find(item => item.id === uniqueId);

            let displayName = currentProduct.name;
            if (variantLabel !== 'Default') displayName += ` (${variantLabel})`;
            if (colorName) displayName += ` · ${colorName}`;

            if (existingItem) {
                existingItem.quantity += 1;
                showToast(`📦 ${displayName} quantity updated!`);
            } else {
                cart.push({
                    id: uniqueId,
                    name: currentProduct.name,
                    brand: currentProduct.brand,
                    price: price,
                    image: currentProduct.image || currentProduct.images?.[0] || '',
                    quantity: 1,
                    variant: variantLabel,
                    color: colorName
                });
                showToast(`✅ ${displayName} added to cart!`);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function buyNow() {
            addToCartFromProduct();
            setTimeout(() => window.location.href = 'cart.html', 600);
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.querySelectorAll('.cart-badge').forEach(b => {
                b.textContent = total;
                b.style.display = total > 0 ? 'flex' : 'none';
            });
        }

        // ==========================================
        // INIT
        // ==========================================
        function init() {
            allProducts = [
                ...(typeof mobileProducts !== "undefined" ? mobileProducts : []),
                ...(typeof refrigeratorProducts !== "undefined" ? refrigeratorProducts : []),
                ...(typeof washingProducts !== "undefined" ? washingProducts : []),
                ...(typeof acProducts !== "undefined" ? acProducts : []),
                ...(typeof tvProducts !== "undefined" ? tvProducts : [])
            ];

            if (allProducts.length === 0) {
                document.getElementById('productPage').innerHTML = `
                            <div style="text-align:center;padding:60px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:16px;">
                                <div style="font-size:50px;margin-bottom:16px;">⚠️</div>
                                <h2 style="color:#D4AF37;font-size:24px;">No Products Loaded</h2>
                                <p style="color:#888;margin:8px 0 20px;font-size:14px;">Please check your data files.</p>
                                <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
                            </div>
                        `;
                return;
            }
            loadProduct();
            updateCartBadge();
        }

        // Start
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(init, 100);
        } else {
            document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
        }
        window.addEventListener('load', () => {
            if (allProducts.length === 0) setTimeout(init, 200);
        });
    </script>
