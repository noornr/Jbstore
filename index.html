<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Store</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">

<div class="logo">
JB <span>STORE</span>
</div>

<div class="search">
<input type="text" placeholder="Search Mobiles, TVs, Refrigerators...">
</div>

<div class="cart">
🛒
</div>

</header>

<nav class="menu">

<a>Mobiles</a>
<a>2nd Hand</a>
<a>Refrigerators</a>
<a>Washing</a>
<a>AC</a>
<a>TV</a>

</nav>

<section class="hero">

<div class="overlay"></div>

<div class="hero-left">

<p>PREMIUM ELECTRONICS</p>

<h1>Seal Pack & 2nd Hand Mobiles</h1>

<span>
Mobiles • Refrigerators • Washing Machines • Air Conditioners
</span>

<div class="buttons">

<button class="gold">
Shop Now
</button>

<button class="dark">
WhatsApp
</button>

</div>

</div>

<div class="hero-right">

<img src="images/hero.jpg">

</div>

</section>

  <section class="categories">

<div class="title-row">
<h2>Shop by Category</h2>
<a href="#">View All →</a>
</div>

<div class="cat-grid">

<div class="cat-card">
<img src="images/iphone.png">
<p>Seal Pack Mobiles</p>
</div>

<div class="cat-card">
<img src="images/samsung.png">
<p>2nd Hand Mobiles</p>
</div>

<div class="cat-card">
<img src="images/fridge.png">
<p>Refrigerators</p>
</div>

<div class="cat-card">
<img src="images/washing.png">
<p>Washing Machines</p>
</div>

<div class="cat-card">
<img src="images/ac.png">
<p>Air Conditioners</p>
</div>

<div class="cat-card">
<img src="images/tv.png">
<p>Smart TVs</p>
</div>

</div>

  </section>

<script src="script.js"></script>

</body>
</html>
