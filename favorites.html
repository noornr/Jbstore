<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Favorites | JB STORE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header class="header"><div class="logo">JB <span>STORE</span></div>
  <div class="search"><input type="text" id="searchInput" placeholder="Search..."><button id="searchButton">🔍</button><div id="searchSuggestions" class="search-suggestions"></div></div>
</header>
<main class="favorites-page">
  <div class="page-head">
    <!-- ✅ Back button తీసేశాను. ఇప్పుడు నేరుగా టైటిల్ మరియు కౌంట్ మాత్రమే ఉన్నాయి -->
    <h1>Your Favorites</h1>
    <span class="fav-count" id="favCount">0 items</span>
  </div>
  <div id="favoritesGrid" class="fav-grid"></div>
</main>
<div class="bottom-bar"><div class="bottom-container">
  <a href="index.html" class="bottom-item" id="bottomHome"><span class="bottom-icon">🏠</span><span class="bottom-label">Home</span></a>
  <a href="favorites.html" class="bottom-item active fav-active" id="bottomFav"><span class="bottom-icon" style="color:#ff1744;">❤️</span><span class="fav-badge" id="favBadge">0</span><span class="bottom-label" style="color:#ff1744;font-weight:700;">Favorites</span></a>
  <a href="#" class="bottom-item call-item" id="bottomCall"><span class="bottom-icon">📞</span><span class="bottom-label">Call</span></a>
  <a href="cart.html" class="bottom-item cart-item"><span class="bottom-icon">🛒</span><span class="cart-badge" id="cartBadge">0</span><span class="bottom-label">Cart</span></a>
</div></div>
<script src="config.js"></script>
<script src="mobiles.js"></script>
<script src="refrigerator.js"></script>
<script src="washing.js"></script>
<script src="ac.js"></script>
<script src="tv.js"></script>
<script src="script.js"></script>
<script src="favorites.js"></script>
<script>
  function renderFavoritesGrid() {
    const grid = document.getElementById('favoritesGrid'); const countEl = document.getElementById('favCount');
    const favIds = getFavorites(); const all = [...(window.mobileProducts||[]),...(window.refrigeratorProducts||[]),...(window.washingProducts||[]),...(window.acProducts||[]),...(window.tvProducts||[])];
    const favProducts = all.filter(p => favIds.includes(p.id));
    if (!favProducts.length) { grid.innerHTML=`<div class="fav-empty"><span class="empty-icon">💔</span><h2>No favorites yet</h2><p>Tap the heart ❤️ on any product to save it here.</p><a href="index.html" class="shop-now-btn">Browse Products</a></div>`; countEl.textContent='0 items'; return; }
    countEl.textContent = favProducts.length + ' items'; grid.innerHTML='';
    favProducts.forEach(p => {
      const card = document.createElement('div'); card.className='best-card'; card.style.position='relative'; card.style.cursor='pointer'; card.setAttribute('onclick', `viewProduct('${p.id}')`);
      card.innerHTML = `<button class="favorite-btn is-fav" data-product-id="${p.id}" onclick="event.stopPropagation(); toggleFavorite('${p.id}')"><i class="fa-solid fa-heart"></i></button><img src="${p.image||'images/placeholder.png'}" alt="${p.name}"><h3>${p.name}</h3><p class="brand">${p.brand}</p><div class="price-row"><span class="new">₹${(p.price||0).toLocaleString('en-IN')}</span><span class="old">₹${(p.oldPrice||0).toLocaleString('en-IN')}</span></div><button onclick="event.stopPropagation(); viewProduct('${p.id}')">View Details</button>`;
      grid.appendChild(card);
    });
  }
  document.addEventListener('DOMContentLoaded', function() {
    const phone = window.STORE_PHONE || '919999999999'; const tel = 'tel:' + phone;
    document.getElementById('bottomCall')?.setAttribute('href', tel);
    renderFavoritesGrid(); updateFavBadge(); if (typeof updateCartBadge === 'function') updateCartBadge();
  });
  const originalToggle = window.toggleFavorite;
  window.toggleFavorite = function(id) { originalToggle(id); if (window.location.pathname.includes('favorites.html')) renderFavoritesGrid(); };
</script>
</body>
</html>
