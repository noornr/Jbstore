<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Search | JB STORE</title>

<link rel="stylesheet" href="style.css">

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

</head>

<body>


<!-- HEADER -->

<header class="header">

  <a href="index.html" class="logo">
    JB <span>STORE</span>
  </a>

  <div class="search">

  <input
    type="text"
    id="searchInput"
    placeholder="Search products..."
    autocomplete="off"
  >

  <button
    type="button"
    id="searchButton">
    🔍
  </button>

  <div
    id="searchSuggestions"
    class="search-suggestions">
  </div>

</div>
  
  <div class="cart">
    🛒
  </div>

</header>


<!-- SEARCH PAGE -->

<main class="search-page">


  <!-- TOP BAR -->

  <div class="search-heading">

    <div>

      <p class="search-small">
        SEARCH RESULTS
      </p>

      <h1 id="searchTitle">
        Products
      </h1>

    </div>

    <span id="resultCount"></span>

  </div>


  <!-- FILTER + PRODUCTS -->

  <div class="search-layout">


    <!-- LEFT FILTER -->

    <aside class="search-sidebar">

      <h3>Filter Products</h3>

      <div class="filter-section">

        <h4>Brand</h4>

        <div id="searchBrands"></div>

      </div>


      <button
        id="clearSearchFilters"
        class="clear-search"
      >
        Clear All
      </button>

    </aside>


    <!-- PRODUCTS -->

    <section class="search-results">

      <div
        id="searchProductGrid"
        class="search-product-grid"
      ></div>

    </section>


  </div>

</main>


<!-- PRODUCT DATA -->

<script src="mobiles.js"></script>
<script src="refrigerator.js"></script>
<script src="washing.js"></script>
<script src="ac.js"></script>
<script src="tv.js"></script>


<script>

// ==========================================
// ALL PRODUCTS
// ==========================================

const allProducts = [

  ...mobileProducts,
  ...refrigeratorProducts,
  ...washingProducts,
  ...acProducts,
  ...tvProducts

];


// ==========================================
// GET SEARCH PARAMETERS
// ==========================================

const params =
  new URLSearchParams(
    window.location.search
  );


let searchTerm =
  params.get("q") || "";


let selectedSearchBrand =
  params.get("brand") || "";


let selectedSearchCategory =
  params.get("category") || "";


searchTerm =
  searchTerm.trim();

selectedSearchBrand =
  selectedSearchBrand.trim();

selectedSearchCategory =
  selectedSearchCategory.trim();


// ==========================================
// ELEMENTS
// ==========================================

const searchInput =
  document.getElementById("searchInput");

const searchProductGrid =
  document.getElementById(
    "searchProductGrid"
  );

const searchTitle =
  document.getElementById("searchTitle");

const resultCount =
  document.getElementById("resultCount");

const searchBrands =
  document.getElementById("searchBrands");


// ==========================================
// SET SEARCH BOX
// ==========================================

if(
  selectedSearchBrand &&
  selectedSearchCategory
){

  const categoryName = {

    mobiles: "Mobiles",

    fridge: "Refrigerator",

    washing: "Washing Machine",

    ac: "AC",

    tv: "TV"

  }[selectedSearchCategory]
    || selectedSearchCategory;


  searchInput.value =
    `${selectedSearchBrand} ${categoryName}`;

}
else{

  searchInput.value =
    searchTerm;

}



// ==========================================
// GET SEARCH PRODUCTS
// ==========================================

function getSearchProducts(){

  // ========================================
  // BRAND + CATEGORY SEARCH
  // ========================================

  if(
    selectedSearchBrand &&
    selectedSearchCategory
  ){

    return allProducts.filter(
      product => {

        return (

          product.brand
            .toLowerCase() ===
          selectedSearchBrand
            .toLowerCase()

          &&

          product.category
            .toLowerCase() ===
          selectedSearchCategory
            .toLowerCase()

        );

      }
    );

  }


  // ========================================
  // NORMAL TEXT SEARCH
  // ========================================

  const text =
    searchTerm.toLowerCase();


  return allProducts.filter(
    product => {

      return (

        product.name
          .toLowerCase()
          .includes(text)

        ||

        product.brand
          .toLowerCase()
          .includes(text)

        ||

        product.id
          .toLowerCase()
          .includes(text)

        ||

        product.category
          .toLowerCase()
          .includes(text)

        ||

        (product.condition || "")
          .toLowerCase()
          .includes(text)

      );

    }
  );

}

// ==========================================
// SHOW PRODUCTS
// ==========================================

function displaySearchProducts(
  products
){

  searchProductGrid.innerHTML = "";


  resultCount.innerText =
    `${products.length} Products`;


  if(products.length === 0){

    searchProductGrid.innerHTML = `

      <div class="search-empty">

        <div>🔍</div>

        <h2>No products found</h2>

        <p>
          Try another product or brand.
        </p>

      </div>

    `;

    return;

  }


  products.forEach(product => {

    const card =
  document.createElement("div");

card.className =
  "search-product-card";

card.style.cursor = "pointer";

card.addEventListener("click", () => {
  openProduct(product.id);
});


    card.innerHTML = `

      <div class="search-product-image">

        <span class="search-offer">
          ${product.discount}
        </span>

        <img
          src="${product.image}"
          alt="${product.name}"
        >

      </div>


      <div class="search-product-info">

        <p class="search-brand">
          ${product.brand}
        </p>

        <h3>
          ${product.name}
        </h3>

        <div class="search-rating">
          ⭐ ${product.rating}
          <span>
            (${product.reviews})
          </span>
        </div>

        <p class="search-condition">
          ${product.condition || "New"}
        </p>

        <div class="search-price">

          <strong>
            ₹${product.price.toLocaleString("en-IN")}
          </strong>

          <del>
            ₹${product.oldPrice.toLocaleString("en-IN")}
          </del>

        </div>

        <button
          type="button"
          onclick="openProduct('${product.id}')"
        >
          View Details
        </button>

      </div>

    `;


    searchProductGrid.appendChild(card);

  });

}


// ==========================================
// BRAND FILTER
// ==========================================

function loadSearchBrands(){

  const products =
    getSearchProducts();


  const uniqueBrands =
    [...new Set(
      products.map(product => product.brand)
    )];


  searchBrands.innerHTML = "";


  uniqueBrands.forEach(brand => {

    const button =
      document.createElement("button");

    button.className =
      "search-brand-btn";

    button.innerText =
      brand;


    button.onclick = () => {

  document
    .querySelectorAll(
      ".search-brand-btn"
    )
    .forEach(btn => {
      btn.classList.remove("active");
    });


  button.classList.add("active");


  const filtered =
    products.filter(product =>
      product.brand === brand
    );


  displaySearchProducts(filtered);


  // CLOSE FILTER CARD ON MOBILE

  if(window.innerWidth <= 768){

    const filterCard =
      document.querySelector(
        ".search-sidebar"
      );

    if(filterCard){

      filterCard.style.display = "none";

    }

  }

};


    searchBrands.appendChild(button);

  });

}


// ==========================================
// OPEN PRODUCT
// ==========================================

function openProduct(id){

  const product =
    allProducts.find(
      item => item.id === id
    );


  if(!product) return;


  localStorage.setItem(
    "selectedProduct",
    JSON.stringify(product)
  );


  window.location.href =
    "product.html";

}


// ==========================================
// SEARCH AGAIN
// ==========================================

function performSearch(){

  const value =
    searchInput.value.trim();


  if(!value){

    window.location.href =
      "index.html";

    return;

  }


  window.location.href =
    `search.html?q=${encodeURIComponent(value)}`;

}


document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


searchInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      performSearch();

    }

  }
);

  // ==========================================
// SEARCH SUGGESTIONS
// ==========================================

const searchSuggestions =
  document.getElementById("searchSuggestions");


// ==========================================
// CATEGORY NAMES
// ==========================================

const categoryNames = {

  mobiles: "Mobiles",

  fridge: "Refrigerator",

  washing: "Washing Machine",

  ac: "AC",

  tv: "TV"

};


// ==========================================
// CREATE SEARCH SUGGESTIONS
// ==========================================

function createSearchSuggestions(){

  if(
    !searchInput ||
    !searchSuggestions
  ){

    return;

  }


  const text =
    searchInput.value
      .trim()
      .toLowerCase();


  searchSuggestions.innerHTML = "";


  // EMPTY SEARCH

  if(text === ""){

    searchSuggestions.classList.remove(
      "show"
    );

    return;

  }


  // ==========================================
  // FIND BRAND + CATEGORY
  // FROM ACTUAL PRODUCTS ONLY
  // ==========================================

  const combinations =
    new Map();


  allProducts.forEach(product => {

    const brand =
      String(
        product.brand || ""
      ).trim();


    const category =
      String(
        product.category || ""
      ).trim();


    if(
      !brand ||
      !category
    ){

      return;

    }


    const brandLower =
      brand.toLowerCase();


    const categoryLower =
      category.toLowerCase();


    // MATCH TYPED LETTERS

    if(
      brandLower.includes(text) ||
      categoryLower.includes(text)
    ){

      const key =
        `${brandLower}|${categoryLower}`;


      if(
        !combinations.has(key)
      ){

        combinations.set(
          key,
          {

            brand: brand,

            category: category,

            image: product.image ||
                   product.images?.[0] ||
                   ""

          }
        );

      }

    }

  });


  // ==========================================
  // CONVERT TO ARRAY
  // ==========================================

  const suggestions =
    Array.from(
      combinations.values()
    );


  // ==========================================
  // SORT
  // BRAND STARTS WITH SEARCH FIRST
  // ==========================================

  suggestions.sort((a,b) => {

    const aBrand =
      a.brand.toLowerCase();


    const bBrand =
      b.brand.toLowerCase();


    const aStarts =
      aBrand.startsWith(text);


    const bStarts =
      bBrand.startsWith(text);


    if(
      aStarts &&
      !bStarts
    ){

      return -1;

    }


    if(
      !aStarts &&
      bStarts
    ){

      return 1;

    }


    return aBrand.localeCompare(
      bBrand
    );

  });


  // ==========================================
  // MAXIMUM 10
  // ==========================================

  const finalResults =
    suggestions.slice(0,10);


  // ==========================================
  // NO RESULTS
  // ==========================================

  if(
    finalResults.length === 0
  ){

    searchSuggestions.innerHTML = `

      <div class="search-no-result">

        No products found

      </div>

    `;


    searchSuggestions.classList.add(
      "show"
    );


    return;

  }


  // ==========================================
  // DISPLAY
  // ==========================================

  finalResults.forEach(item => {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "search-suggestion";


    const displayCategory =
      categoryNames[
        item.category
      ] ||
      item.category;


    row.innerHTML = `

      <img
        src="${item.image}"
        alt=""
      >

      <div class="suggestion-info">

        <div class="suggestion-name">

          ${highlightSearch(
            item.brand,
            text
          )}

          ${displayCategory}

        </div>


        <div class="suggestion-category">

          View ${item.brand}
          ${displayCategory}

        </div>

      </div>


      <span class="suggestion-arrow">

        ↗

      </span>

    `;


    // ========================================
    // CLICK SUGGESTION
    // ========================================

    row.addEventListener(
  "click",
  () => {

    window.location.href =
      "search.html?brand=" +
      encodeURIComponent(item.brand) +
      "&category=" +
      encodeURIComponent(item.category);

  }
);


    searchSuggestions.appendChild(
      row
    );

  });


  searchSuggestions.classList.add(
    "show"
  );

}


// ==========================================
// HIGHLIGHT SEARCH TEXT
// ==========================================

function highlightSearch(
  text,
  search
){

  const escaped =
    search.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );


  return text.replace(

    new RegExp(
      `(${escaped})`,
      "ig"
    ),

    "<strong>$1</strong>"

  );

}


// ==========================================
// OPEN SEARCH RESULTS
// ==========================================

function openSearchResults(
  value
){

  if(!value){

    return;

  }


  window.location.href =
    "search.html?q=" +
    encodeURIComponent(
      value
    );

}


// ==========================================
// LIVE SEARCH
// ==========================================

if(searchInput){

  searchInput.addEventListener(
    "input",
    createSearchSuggestions
  );

}


// ==========================================
// CLOSE SUGGESTIONS
// ==========================================

document.addEventListener(
  "click",
  event => {

    if(

      searchInput &&

      searchSuggestions &&

      !searchInput.contains(
        event.target
      ) &&

      !searchSuggestions.contains(
        event.target
      )

    ){

      searchSuggestions.classList.remove(
        "show"
      );

    }

  }
);

// ==========================================
// INITIAL LOAD
// ==========================================

if(
  selectedSearchBrand &&
  selectedSearchCategory
){

  const categoryName = {

    mobiles: "Mobiles",

    fridge: "Refrigerators",

    washing: "Washing Machines",

    ac: "AC",

    tv: "TV"

  }[selectedSearchCategory]
    || selectedSearchCategory;


  searchTitle.innerText =
    `${selectedSearchBrand} ${categoryName}`;

}
else{

  searchTitle.innerText =
    searchTerm
      ? `"${searchTerm}"`
      : "All Products";

}


displaySearchProducts(
  getSearchProducts()
);

loadSearchBrands();

  // ==========================================
// CLEAR ALL SEARCH FILTERS
// ==========================================

const clearSearchFilters =
  document.getElementById(
    "clearSearchFilters"
  );


if(clearSearchFilters){

  clearSearchFilters.addEventListener(
    "click",
    () => {

      // Remove brand + category filter

      selectedSearchBrand = "";

      selectedSearchCategory = "";


      // Remove search text

      searchTerm = "";


      // Clear search box

      searchInput.value = "";


      // Change URL to normal search page

      window.history.replaceState(
        {},
        "",
        "search.html"
      );


      // Reset title

      searchTitle.innerText =
        "All Products";


      // Show all products

      displaySearchProducts(
        allProducts
      );


      const filterCard =
  document.querySelector(
    ".search-sidebar"
  );

if(filterCard){

  filterCard.style.display = "";

}
      // Reload available brands

      loadSearchBrands();

    }
  );

}

</script>

</body>
</html>
