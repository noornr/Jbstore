<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">JB STORE</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#sell">Sell</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <span class="tag">PREMIUM MOBILE STORE</span>
    <h1>Buy & Sell <span>New</span> & Used Mobiles</h1>
    <p>Premium smartphones with the best prices and quality assurance.</p>
    <a class="btn" href="#shop">Shop Now</a>
  </div>
</section>

<section class="stats">
  <div><h2>1000+</h2><p>Sold</p></div>
  <div><h2>500+</h2><p>Customers</p></div>
  <div><h2>4.9★</h2><p>Rating</p></div>
</section>

<section id="shop" class="section">
  <h2>Featured Mobiles</h2>
  <input id="search" placeholder="Search phone...">
  <div id="products" class="grid"></div>
</section>

<section id="sell" class="section">
  <h2>Sell Your Phone</h2>
  <form id="sellForm">
    <input id="name" placeholder="Your Name" required>
    <input id="model" placeholder="Phone Model" required>
    <button class="btn" type="submit">WhatsApp Enquiry</button>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>
